name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json defines only dev/build/preview -- there is no test or lint
      # script to run, so the build is the quality gate. `vite build` parses and
      # bundles every module reachable from index.html, so a syntax error or an
      # unresolvable import fails the job.
      - name: Build
        run: npm run build
